<!DOCTYPE html>
<html>
  <head>
    <title>JS Button Example</title>
  </head>
  <body>
    <h1>Click the Button!</h1>

    <button onclick="sayHello()">Say Hello</button>
    <button onclick="sayJoke()">Tell Me a Joke</button>

    <script>
      function sayHello() {
        alert("Hello from JavaScript!");
      }
      function sayJoke() {
        alert("Why did the developer go broke? Because he used up all his cache!");
      }
    </script>
  </body>
</html>
