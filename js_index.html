<!DOCTYPE html>
<html>
  <head>
    <title>Square Input</title>
  </head>
  <body>
    <h2>Enter a number:</h2>
    <input type="number" id="numInput" placeholder="Number">
    <button onclick="square()">Square It!</button>

    <script>
      function square() {
        let num = document.getElementById("numInput").value;
        if (num === "") {
          alert("Please enter your number first!");
          return;
        }
        alert("Square: " + (num * num));
      }
    </script>
  </body>
</html>
